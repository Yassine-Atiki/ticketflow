
openapi: 3.0.3

info:
  title: Event Service API
  description: |
    Gestion des événements, catégories, lieux et catégories de billets (TicketFlow).

    Ce document présente le contrat API proposé pour Event Service.
    Les endpoints métier sont documentés mais ne sont pas encore implémentés.
    Les opérations de réservation et de libération de capacité
    seront développées ultérieurement.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Via API Gateway
  - url: http://localhost:8082
    description: Direct

tags:
  - name: Events
  - name: Ticket tiers
  - name: Categories
  - name: Venues
  - name: Internal

security:
  - bearerAuth: []

paths:
  /api/v1/events:
    post:
      tags: [Events]
      summary: Créer un événement (statut DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Events]
      summary: Rechercher les événements publiés
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Mot-clé }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: city, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: sort, in: query, schema: { type: string, example: 'startDate,asc' } }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEventSummary'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Détail d'un événement
      security: []
      responses:
        '200':
          description: Événement trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      summary: Modifier un événement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Événement modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Events]
      summary: Supprimer un événement (DRAFT uniquement)
      responses:
        '204':
          description: Supprimé
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/events/{id}/publish:
    patch:
      tags: [Events]
      summary: Publier un événement (DRAFT → PUBLISHED)
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Événement publié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/events/{id}/close:
    patch:
      tags: [Events]
      summary: Fermer un événement (PUBLISHED → CLOSED)
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Événement fermé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/events/{id}/cancel:
    patch:
      tags: [Events]
      summary: Annuler un événement (PUBLISHED → CANCELLED)
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Événement annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/events/{id}/tiers:
    post:
      tags: [Ticket tiers]
      summary: Ajouter une catégorie de billet
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTierRequest'
      responses:
        '201':
          description: Catégorie de billet créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTierResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Lister les catégories
      security: []
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Créer une catégorie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/venues:
    get:
      tags: [Venues]
      summary: Lister les lieux
      security: []
      responses:
        '200':
          description: Liste des lieux
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueResponse'
    post:
      tags: [Venues]
      summary: Créer un lieu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueRequest'
      responses:
        '201':
          description: Lieu créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/internal/events/{id}/capacity/reservations:
    post:
      tags: [Internal]
      operationId: reserveCapacity
      summary: Réserver atomiquement la capacité pour un Booking
      description: |
        Toutes les lignes concernent le même événement. Chaque ticketTierId doit être
        distinct (doublon = 400) et appartenir à cet événement (sinon 404).
        Si une seule ligne manque de places, 409 INSUFFICIENT_CAPACITY et aucune
        modification du stock ni enregistrement de réservation, pour toutes les lignes.
        La clé de déduplication persistante globale est bookingId seul.
        L'empreinte comparée est l'événement et l'ensemble des couples
        (ticketTierId, quantity), indépendamment de l'ordre des lignes.
        Premier succès = 201. Rejeu identique encore RESERVED = 200 avec la réponse
        initiale enregistrée, sans nouvelle décrémentation. Même bookingId avec des
        données différentes, ou déjà RELEASED = 409 IDEMPOTENCY_CONFLICT.
        Les détails de rejeu et de réponse sont confirmés avec Booking
        selon le retour du responsable Event ; leur implémentation reste à développer.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityRequest'
      responses:
        '201':
          description: Capacité réservée pour toutes les lignes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityResponse'
        '200':
          description: Rejeu identique ; réponse de réservation initiale sans effet supplémentaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INSUFFICIENT_CAPACITY ou IDEMPOTENCY_CONFLICT ; aucune modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: EVENT_NOT_BOOKABLE (événement non publié, fermé ou annulé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/internal/events/{id}/capacity/reservations/{bookingId}:
    delete:
      tags: [Internal]
      operationId: releaseCapacity
      summary: Libérer atomiquement toutes les lignes du Booking
      description: |
        Sans corps : les quantités et catégories sont retrouvées dans la réservation
        persistée. Aucune libération partielle. La libération reste possible même
        si l'événement est fermé ou annulé.
        Premier succès = 200. Rejeu identique = 200 avec la réponse de libération
        initiale enregistrée, sans restituer les places une deuxième fois.
        bookingId inconnu = 404. bookingId connu pour un autre événement = 409
        IDEMPOTENCY_CONFLICT (libération contradictoire), sans effet sur le stock.
        Ces détails sont confirmés avec Booking selon le retour du responsable Event.
        Leur implémentation reste à développer.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Toutes les lignes libérées ou réponse initiale de libération rejouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Libération contradictoire (bookingId associé à un autre événement)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TierId:
      name: tierId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }


  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Règle métier non respectée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, CANCELLED]

    TicketTierRequest:
      type: object
      required: [name, price, currency, totalCapacity]
      properties:
        name: { type: string, example: Standard }
        price: { type: number, minimum: 0, example: 150.00 }
        currency: { type: string, example: MAD }
        totalCapacity: { type: integer, minimum: 1, example: 500 }

    TicketTierResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: number }
        currency: { type: string }
        totalCapacity: { type: integer }
        availableCapacity: { type: integer }

    CreateEventRequest:
      type: object
      required: [title, categoryId, venueId, startDate, endDate]
      properties:
        title: { type: string, example: Concert Jazz }
        description: { type: string }
        categoryId: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        imageUrl: { type: string }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TicketTierRequest' }

    UpdateEventRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        categoryId: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        imageUrl: { type: string }

    EventResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/CategoryResponse' }
        venue: { $ref: '#/components/schemas/VenueResponse' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        imageUrl: { type: string }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TicketTierResponse' }

    EventSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        city: { type: string }
        startDate: { type: string, format: date-time }
        minPrice: { type: number }
        status: { $ref: '#/components/schemas/EventStatus' }

    PageEventSummary:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/EventSummaryResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Musique }
        description: { type: string }

    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }

    VenueRequest:
      type: object
      required: [name, address, city]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        capacity: { type: integer }

    VenueResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        capacity: { type: integer }


    CapacityLine:
      type: object
      additionalProperties: false
      required: [ticketTierId, quantity]
      properties:
        ticketTierId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, example: 2 }

    CapacityRequest:
      type: object
      additionalProperties: false
      required: [bookingId, lines]
      properties:
        bookingId:
          type: string
          format: uuid
          description: Clé de déduplication globale pour toutes les lignes du Booking
        lines:
          type: array
          minItems: 1
          description: Catégories de billets distinctes appartenant au même événement
          items: { $ref: '#/components/schemas/CapacityLine' }
      example:
        bookingId: b3e1f9a0-1c2d-4e5f-8a9b-0c1d2e3f4a5b
        lines:
          - ticketTierId: f1e2d3c4-b5a6-4978-8695-a4b3c2d1e0f9
            quantity: 2

    CapacityResponse:
      type: object
      description: Réponse persistée ; les capacités sont un instantané de l'opération initiale, pas le stock actuel lors d'un rejeu
      required: [bookingId, eventId, status, lines]
      properties:
        bookingId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [RESERVED, RELEASED] }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [ticketTierId, quantity, availableCapacity]
            properties:
              ticketTierId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              availableCapacity: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: EVENT_NOT_FOUND }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
