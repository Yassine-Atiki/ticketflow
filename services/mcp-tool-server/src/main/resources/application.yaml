spring:
  application:
    name: mcp-tool-server
  config:
    # Mandatory. IntelliJ uses the localhost default. Docker sets CONFIG_SERVER_URL
    # to http://host.docker.internal:8888 so the container can reach Config Server on the host.
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      label: main
      fail-fast: true
      request-connect-timeout: 1000
      request-read-timeout: 1000
