server:
  port: ${SERVER_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: mcp-tool-server

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: mcp-tool-server
    description: MCP tool server for the TicketFlow AI Assistant

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  ai:
    mcp:
      enabled: false

ticketflow:
  mcp:
    endpoint: /mcp
    server-name: ticketflow-mcp
    server-version: 0.0.1-SNAPSHOT
    allowed-hosts:
      - "localhost:*"
      - "127.0.0.1:*"
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  security:
    propagate-authorization: true
  services:
    event:
      base-url: ${EVENT_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        # Paths, methods and parameter names below are placeholders.
        # contract-confirmed stays false until Event Service publishes its OpenAPI contract.
        search:
          method: GET
          path: /api/events
          contract-confirmed: false
          query:
            keyword: keyword
            category: category
            date: date
            location: location
        details:
          method: GET
          path: /api/events/{eventId}
          contract-confirmed: false
        upcoming:
          method: GET
          path: /api/events/upcoming
          contract-confirmed: false
          query:
            limit: limit
            category: category
            location: location
    ticket:
      base-url: ${TICKET_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        availability:
          method: GET
          path: /api/events/{eventId}/tickets/availability
          contract-confirmed: false
          query:
            ticketType: ticketType
            quantity: quantity
        mine:
          method: GET
          path: /api/customers/{customerId}/tickets
          contract-confirmed: false
    booking:
      base-url: ${BOOKING_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        create:
          method: POST
          path: /api/bookings
          contract-confirmed: false
          body:
            eventId: eventId
            customerId: customerId
            quantity: quantity
            ticketType: ticketType
        status:
          method: GET
          path: /api/bookings/{bookingId}
          contract-confirmed: false
        cancel:
          method: POST
          path: /api/bookings/{bookingId}/cancel
          contract-confirmed: false
          body:
            customerId: customerId
            reason: reason
    payment:
      base-url: ${PAYMENT_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        initiate:
          method: POST
          path: /api/payments
          contract-confirmed: false
          body:
            bookingId: bookingId
        status:
          method: GET
          path: /api/payments/{paymentId}
          contract-confirmed: false
    customer:
      # customer-service is the only published API. Its README documents port 8081.
      # application.properties in that module does not set server.port (Boot default is 8080).
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        profile:
          method: GET
          path: /api/customers/{customerId}
          contract-confirmed: true
    notification:
      base-url: ${NOTIFICATION_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        history:
          method: GET
          path: /api/notifications
          contract-confirmed: false
          query:
            customerId: customerId
            bookingId: bookingId
        resend:
          method: POST
          path: /api/notifications/booking-confirmation
          contract-confirmed: false
          body:
            bookingId: bookingId
            customerId: customerId
