server:
  port: ${SERVER_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: mcp-tool-server
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      label: main
      fail-fast: false
      request-connect-timeout: 1000
      request-read-timeout: 1000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: mcp-tool-server
    description: MCP tool server for the TicketFlow AI Assistant

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
  ai:
    mcp:
      enabled: false

ticketflow:
  mcp:
    endpoint: /mcp
    server-name: ticketflow-mcp
    server-version: 0.0.1-SNAPSHOT
    allowed-hosts:
      - "localhost:*"
      - "127.0.0.1:*"
      - "mcp-tool-server:*"
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  security:
    propagate-authorization: true
  services:
    event:
      base-url: ${EVENT_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        # Paths match the published Event Service contract. The endpoint is not implemented yet.
        search:
          method: GET
          path: /api/v1/events
          contract-confirmed: false
          query:
            q: q
            categoryId: categoryId
            city: city
            dateFrom: dateFrom
            dateTo: dateTo
            page: page
            size: size
            sort: sort
        details:
          method: GET
          path: /api/v1/events/{id}
          contract-confirmed: false
    ticket:
      base-url: ${TICKET_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        mine:
          method: GET
          path: /api/v1/me/tickets
          contract-confirmed: false
          query:
            page: page
            size: size
            status: status
    booking:
      base-url: ${BOOKING_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        create:
          method: POST
          path: /api/v1/bookings
          contract-confirmed: false
          body:
            eventId: eventId
            lines: lines
        status:
          method: GET
          path: /api/v1/bookings/{id}
          contract-confirmed: false
        cancel:
          method: POST
          path: /api/v1/bookings/{id}/cancel
          contract-confirmed: false
          body:
            reason: reason
    payment:
      base-url: ${PAYMENT_SERVICE_URL:}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        initiate:
          method: POST
          path: /api/payments
          contract-confirmed: false
          body:
            bookingId: bookingId
            provider: provider
        status:
          method: GET
          path: /api/payments/{id}
          contract-confirmed: false
    customer:
      # Implemented Customer Service API. Its README documents port 8081.
      # application.properties in that module does not set server.port (Boot default is 8080).
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
      connect-timeout: 2s
      response-timeout: 5s
      idempotency-header: Idempotency-Key
      operations:
        profile:
          method: GET
          path: /api/customers/{customerId}
          contract-confirmed: true
