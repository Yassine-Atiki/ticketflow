services:
  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    ports:
      - "127.0.0.1:8081:8081"

  mcp-tool-server:
    build:
      context: ..
      dockerfile: services/mcp-tool-server/Dockerfile
    container_name: mcp-tool-server
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8090"
      # Config Server runs on the host (IntelliJ, port 8888). localhost inside the
      # container is the container itself, so the import uses the host gateway.
      CONFIG_SERVER_URL: http://host.docker.internal:8888
      # Ports are the ones published by each service contract. Inside Compose, two
      # services may both listen on 8082 because each container has its own port space.
      # event-service, booking-service, payment-service and ticket-service are not
      # defined in this file yet; these URLs are ready for when those services are added.
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      TICKET_SERVICE_URL: http://ticket-service:8083

  postgres:
    image: postgres:17
    container_name: ticketflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ticketflow_dev
      POSTGRES_DB: postgres

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
